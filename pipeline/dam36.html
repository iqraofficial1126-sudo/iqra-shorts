<canvas id="gl" width="1080" height="1920"></canvas><svg id="svg" width="1080" height="1920"></svg><div id="ov"></div>
<script>'use strict';
const W=1080,H=1920;
const cv=document.getElementById('gl');const g=cv.getContext('2d');
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const sm=(a,b,t)=>{const x=clamp((t-a)/(b-a));return x*x*(3-2*x)};
const smr=(a,b,t)=>{const x=clamp((t-a)/(b-a));return x*x*x*(x*(x*6-15)+10)};
const lin=(a,b,t)=>clamp((t-a)/(b-a));
// ---------- camera (2D) ----------
let CAM={cx:0,cy:0,k:200};
function proj(p){return[W/2+(p[0]-CAM.cx)*CAM.k,H*.47-(p[1]-CAM.cy)*CAM.k]}
const X=x=>W/2+(x-CAM.cx)*CAM.k, Y=y=>H*.47-(y-CAM.cy)*CAM.k, K=v=>v*CAM.k;
const C={sky1:'#bfe0ff',sky2:'#fff1dc',hill1:'#a9d39a',hill2:'#7fbf7a',ground:'#6fb35f',groundTop:'#86c873',dirt:'#5c9a4f',
 concrete:'#d9d4ca',concreteD:'#b9b2a5',steel:'#5d6b7a',dark:'#2b303c',ink:'#26303f',you:'#ef5b3f',fr:'#3d84e0',skin:'#e0a77d',hair:'#2a1d16',
 blanket:'#8cc4ea',canvas:'#efe6c8',pole:'#8a929c',wood:'#a86a3c',woodD:'#7e4c28',stone:'#a69c8e',stoneD:'#8a8072',water:'#4aa3d6',waterL:'#8fd0f2',
 AM:'#ff9a1a',TE:'#13d1bb'};
// ---------- drawing helpers ----------
function rr(x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r)}
function line(pts,w,col,cap='round'){g.beginPath();g.moveTo(...pts[0]);for(const p of pts.slice(1))g.lineTo(...p);g.lineWidth=w;g.strokeStyle=col;g.lineCap=cap;g.lineJoin='round';g.stroke()}
function circ(x,y,r,col){g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fillStyle=col;g.fill()}
function background(t,par=0){
 const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,C.sky1);gr.addColorStop(.62,C.sky2);g.fillStyle=gr;g.fillRect(0,0,W,H);
 // sun
 const sx=820-par*20,sy=420;const sg=g.createRadialGradient(sx,sy,10,sx,sy,260);sg.addColorStop(0,'rgba(255,236,190,.95)');sg.addColorStop(.25,'rgba(255,226,170,.55)');sg.addColorStop(1,'rgba(255,220,160,0)');g.fillStyle=sg;g.fillRect(0,0,W,H);circ(sx,sy,70,'#fff4d6');
 // clouds
 for(const[cx0,cy0,s,sp]of[[100,300,1,8],[600,220,.8,5],[950,520,.7,6],[300,560,.6,4]]){const x=((cx0+t*sp-par*40)%1400+1400)%1400-160;g.fillStyle='rgba(255,255,255,.85)';
  for(const[dx,dy,r]of[[0,0,46],[50,-18,56],[105,0,44],[50,12,46]]){g.beginPath();g.arc(x+dx*s,cy0+dy*s,r*s,0,Math.PI*2);g.fill()}}
 const gy=Y(0);
 // far hills (parallax)
 const hill=(col,amp,off,base,f)=>{g.beginPath();g.moveTo(0,H);for(let x=0;x<=W;x+=20){const wx=x+off;g.lineTo(x,base-amp*(.6+.4*Math.sin(wx*f)+.25*Math.sin(wx*f*2.3+1)))}g.lineTo(W,H);g.closePath();g.fillStyle=col;g.fill()};
 hill(C.hill1,90,par*.15*CAM.k+CAM.cx*30,gy-170,.006);
 // trees mid layer
 for(let i=-2;i<9;i++){const tx=((i*170+60-(CAM.cx*CAM.k*.45))%1870+1870)%1870-200;const ty=gy-60-(i%3)*14;const s=.8+(i*7%5)*.1;
  g.fillStyle='#6a4a30';g.fillRect(tx-7*s,ty-40*s,14*s,50*s);circ(tx,ty-80*s,52*s,i%2?'#5aa65a':'#4f9a55');circ(tx-30*s,ty-55*s,36*s,i%2?'#62b061':'#56a35c');circ(tx+30*s,ty-55*s,38*s,i%2?'#4f9a55':'#5aa65a')}
 hill(C.hill2,40,par*.3*CAM.k+CAM.cx*60,gy-40,.01);
 // ground
 g.fillStyle=C.ground;g.fillRect(0,gy,W,H-gy);g.fillStyle=C.groundTop;g.fillRect(0,gy,W,K(.08));
 g.fillStyle='rgba(0,0,0,.05)';for(let i=0;i<40;i++){const gx=((i*97-CAM.cx*CAM.k)%1200+1200)%1200-60;g.fillRect(gx,gy+30+(i*53%400),26,6)}}
function shadow(x0,x1,a=.18){g.fillStyle=`rgba(20,40,20,${a})`;g.beginPath();g.ellipse((X(x0)+X(x1))/2,Y(0)+K(.03),Math.abs(X(x1)-X(x0))/2,K(.08),0,0,Math.PI*2);g.fill()}
// arrow: tip world point, dir +1 up -1 down, len meters
function arrow(tip,dir,len,col,a=1,w=.11){if(len<.03||a<=0)return;const hl=Math.min(.32,len*.5),hw=.17;
 const tx=X(tip[0]),ty=Y(tip[1]),by=Y(tip[1]-dir*len),ny=Y(tip[1]-dir*hl);
 g.save();g.globalAlpha=a;g.shadowColor=col;g.shadowBlur=28;
 g.beginPath();g.moveTo(tx-K(w/2),by);g.lineTo(tx+K(w/2),by);g.lineTo(tx+K(w/2),ny);g.lineTo(tx+K(hw),ny);g.lineTo(tx,ty);g.lineTo(tx-K(hw),ny);g.lineTo(tx-K(w/2),ny);g.closePath();
 g.fillStyle=col;g.fill();g.shadowBlur=0;g.lineWidth=3;g.strokeStyle='rgba(255,255,255,.75)';g.stroke();g.restore()}
// figure: feet at (x,y), face +1 right / -1 left
function figure(x,y,face,o){const a=o.a??1;if(a<=0)return;g.save();g.globalAlpha=a;
 const w=o.walk||0,sw=o.walk!==undefined?Math.sin(w)*.45:0,bob=o.walk!==undefined?Math.abs(Math.cos(w))*.035:0;
 const P=(dx,dy)=>[X(x+dx*face),Y(y+dy+bob)];
 const hip=[0,.95],neck=[.04*(o.lean||0)*10,1.48];
 // back leg & arm drawn darker
 const leg=(ang,shade)=>{const kx=Math.sin(ang)*.45,ky=.95-Math.cos(ang)*.45;const fx=kx+Math.sin(ang*.6)*.47,fy=Math.max(0,ky-.47);
  line([P(...hip),P(kx,ky),P(fx,fy-bob)],K(.1),shade);line([P(fx,fy-bob),P(fx+.1,fy-bob)],K(.1),shade)};
 leg(-sw,'#20242e');
 const armTo=(hand,shade)=>{const sh=P(neck[0],1.4);const hd=hand?[X(hand[0]),Y(hand[1])]:P(neck[0]-Math.sin(sw)*.35,.85);
  const el=[(sh[0]+hd[0])/2+K(.05)*face*-1,(sh[1]+hd[1])/2+K(.07)];line([sh,el,hd],K(.085),shade);circ(hd[0],hd[1],K(.055),C.skin)};
 if(o.hands)armTo(o.hands[0],'#20242e');else armTo(null,'#20242e');
 // torso
 line([P(...hip),P(neck[0],1.42)],K(.26),o.shirt);
 leg(sw,C.ink);
 // head
 const hc=P(neck[0]+.03,1.68);circ(hc[0],hc[1],K(.15),C.skin);
 g.beginPath();g.arc(hc[0],hc[1]-K(.02),K(.155),Math.PI*(face>0?1.05:1.0),Math.PI*(face>0?2.0:1.95));g.fillStyle=C.hair;g.fill();
 circ(hc[0]+K(.07)*face,hc[1]+K(.01),K(.022),'#1b1b1b');
 g.beginPath();g.arc(hc[0]+K(.06)*face,hc[1]+K(.06),K(.04),0.2,Math.PI-.2);g.lineWidth=K(.015);g.strokeStyle='#7a3b2a';g.stroke();
 if(o.hands)armTo(o.hands[1],C.ink);else{const sh=P(neck[0],1.4),hd=P(neck[0]+Math.sin(sw)*.35,.85);line([sh,[(sh[0]+hd[0])/2,(sh[1]+hd[1])/2+K(.04)],hd],K(.085),C.ink);circ(hd[0],hd[1],K(.055),C.skin)}
 g.restore()}
function shpJ(x,a){a=clamp(a,.001,.999);const b=1-a;const y=x<=a?b*x*(1-b*b-x*x):a*(1-x)*(1-a*a-(1-x)*(1-x));return y/.125}
// beam drawn as bent band
function beam(x0,x1,ybot,depth,col,colD,amp,a,L0,L){g.beginPath();const n=60;const top=[],bot=[];
 for(let i=0;i<=n;i++){const x=lerp(x0,x1,i/n);const d=amp>0?amp*shpJ(clamp((x-L0)/L),a):0;top.push([X(x),Y(ybot+depth-d)]);bot.push([X(x),Y(ybot-d)])}
 g.moveTo(...top[0]);for(const p of top)g.lineTo(...p);for(const p of bot.reverse())g.lineTo(...p);g.closePath();
 const gr=g.createLinearGradient(0,top[0][1],0,top[0][1]+K(depth));gr.addColorStop(0,col);gr.addColorStop(1,colD);g.fillStyle=gr;g.fill();
 g.lineWidth=4;g.strokeStyle='rgba(40,40,50,.55)';g.stroke()}
function pedestal(x,h){rr(X(x-.45),Y(h),K(.9),K(h),8);g.fillStyle=C.concreteD;g.fill();g.lineWidth=4;g.strokeStyle='rgba(40,40,50,.35)';g.stroke();
 g.fillStyle='rgba(255,255,255,.18)';g.fillRect(X(x-.45)+6,Y(h)+6,K(.9)-12,K(.08))}
function pinSup(x,yb,s){if(s<=0)return;g.save();g.translate(X(x),Y(yb));g.scale(s,s);g.beginPath();g.moveTo(0,-K(.32));g.lineTo(K(.27),0);g.lineTo(-K(.27),0);g.closePath();g.fillStyle=C.steel;g.fill();g.lineWidth=4;g.strokeStyle=C.dark;g.stroke();circ(0,-K(.3),K(.06),C.dark);g.restore()}
function rollSup(x,yb,s){if(s<=0)return;g.save();g.translate(X(x),Y(yb));g.scale(s,s);g.beginPath();g.moveTo(0,-K(.32));g.lineTo(K(.24),-K(.1));g.lineTo(-K(.24),-K(.1));g.closePath();g.fillStyle=C.steel;g.fill();g.lineWidth=4;g.strokeStyle=C.dark;g.stroke();for(const dx of[-.14,0,.14])circ(K(dx),-K(.05),K(.05),C.dark);g.restore()}
const BTOP=1.67,BBOT=1.32;
function loadBlock(lx,by,arA,label=true){rr(X(lx-.26),Y(by+.44),K(.52),K(.44),8);g.fillStyle='#3a4250';g.fill();g.fillStyle=C.AM;g.fillRect(X(lx-.26),Y(by+.44),K(.52),K(.06));
 arrow([lx,by+.5],-1,1.25,C.AM,arA)}

// ---------- catchy FX ----------
function punch(t){let m=1;for(const[p,a]of PUNCH){if(t>=p)m+=a*Math.exp(-(t-p)*5)*Math.cos((t-p)*9)}return m}
function burst(x,y,t0,t,col){const u=(t-t0)/.6;if(u<0||u>1)return;let h='';for(let i=0;i<12;i++){const a=i/12*Math.PI*2,r0=40+u*120,r1=r0+40*(1-u);h+=`<line x1="${x+Math.cos(a)*r0}" y1="${y+Math.sin(a)*r0}" x2="${x+Math.cos(a)*r1}" y2="${y+Math.sin(a)*r1}" stroke="${col}" stroke-width="${10*(1-u)+2}" opacity="${1-u}"/>`}SV.push(`<g class="burst">${h}</g>`)}
function sticker(t,t0,txt){const d=t-t0;if(d<0||d>2.2)return;const inn=Math.min(1,d/.25),out=d>1.9?(d-1.9)/.3:0;const x=-500*(1-easeOutBack(inn))-700*out;
 OV.push(`<div class="stk" style="transform:translateX(${x}px) rotate(-4deg) scale(${1+.15*Math.exp(-d*8)})">${txt}</div>`)}
function easeOutBack(x){const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)}
function hook(t){if(t>2.9)return;const a=Math.min(1,t/.18),o=t>2.5?1-(t-2.5)/.4:1;const sc=t<.18?2.4-1.4*easeOutBack(t/.18):1+.03*Math.sin(t*14)*Math.exp(-t*2);
 OV.push(`<div id="hook" style="opacity:${a*o};transform:scale(${sc}) rotate(${-2*Math.exp(-t*3)}deg) translateY(${-60*(t>2.5?(t-2.5)/.4:0)}px)">${HOOK}</div>`)}
function wipe(t,c){const d=t-c+.35;if(d<0||d>.7)return;const x=-1600+d/.7*3300;OV.push(`<div id="wipe" style="left:${x}px"></div><div id="wipe2" style="left:${x-260}px"></div>`)}
// ---------- overlay ----------
let OV=[],SV=[];
function chip(p,html,cls='wh',a=1,dy=-14){if(a<=0)return;const[x,y]=proj(p);const ty=dy==='below'?'0%':'-100%';const yy=dy==='below'?y+10:y+dy;OV.push(`<div class="chip ${cls}" style="left:${x}px;top:${yy}px;opacity:${a};transform:translate(-50%,${ty}) scale(${.85+.15*a})">${html}</div>`)}
function dimLine(p0,p1,label,a=1,col='#26303f'){if(a<=0)return;const A=proj(p0),B=proj(p1);const e=[A[0]+(B[0]-A[0])*a,A[1]];
 SV.push(`<g opacity="${Math.min(1,a*1.5)}" stroke="${col}" stroke-width="5" stroke-linecap="round"><line x1="${A[0]}" y1="${A[1]}" x2="${e[0]}" y2="${e[1]}"/><line x1="${A[0]}" y1="${A[1]-20}" x2="${A[0]}" y2="${A[1]+20}"/>${a>.98?`<line x1="${B[0]}" y1="${B[1]-20}" x2="${B[0]}" y2="${B[1]+20}"/>`:''}</g>`);
 if(a>.5)OV.push(`<div class="chip wh" style="left:${(A[0]+B[0])/2}px;top:${A[1]+22}px;transform:translate(-50%,0);font-size:36px;padding:6px 16px;opacity:${(a-.5)*2}">${label}</div>`)}
// ---------- captions ----------
function caption(t){for(const[a,b,s0]of CAPS){if(t>=a&&t<b&&s0){const ko=1-sm(b-.2,b,t);
 const parts=s0.split(/(<[^>]+>)/);let words=[];let cur='';let html='';let wi=0;const total=s0.replace(/<[^>]+>/g,'').trim().split(/\s+/).length;const span=Math.max(.6,(b-a)*.6);
 for(const p of parts){if(p.startsWith('<')){html+=p;continue}for(const w of p.split(/(\s+)/)){if(!w)continue;if(/^\s+$/.test(w)){html+=w;continue}
  const tw=a+span*wi/total;const k=clamp((t-tw)/.18);const sc=k<1?.4+.6*easeOutBack(k):1;html+=`<span class="w" style="opacity:${k};transform:scale(${sc}) translateY(${(1-k)*20}px)">${w}</span>`;wi++}}
 return `<div id="cap" style="opacity:${ko}">${html}</div>`}}return ''}

function cr(keys,t){let i=0;while(i<keys.length-2&&t>keys[i+1][0])i++;const k0=keys[Math.max(0,i-1)],k1=keys[i],k2=keys[i+1],k3=keys[Math.min(keys.length-1,i+2)];
 const u=clamp((t-k1[0])/(k2[0]-k1[0]));const out=[];
 for(let j=1;j<k1.length;j++){const m1=(k2[j]-k0[j])/Math.max(1e-6,k2[0]-k0[0])*(k2[0]-k1[0]),m2=(k3[j]-k1[j])/Math.max(1e-6,k3[0]-k1[0])*(k2[0]-k1[0]);
  const u2=u*u,u3=u2*u;out.push((2*u3-3*u2+1)*k1[j]+(u3-2*u2+u)*m1+(-2*u3+3*u2)*k2[j]+(u3-u2)*m2)}return out}

// ===== Short #36: Why are dam walls thicker at the bottom? (Hydrostatic force, `hyd`) =====
// App defaults (lesson hyd): vertical rectangular gate, top edge a = 1 m below the surface, height H = 2 m, width b = 1.5 m.
// App result: F = 58.86 kN. Checked independently: F = rho g hbar A = 1000*9.81*2*3 = 58,860 N.
// Centre of pressure: h* = hbar + IG/(A hbar) = 2 + (1.5*2^3/12)/(3*2) = 2.167 m.
const PUNCH=[[0.15,.12],[13.2,.08],[16.6,.10],[36.6,.07],[44.2,.06],[55.4,.06]];
const HOOK='Why are dam walls<br><span>THICKER</span> at the bottom?';
const T_END=66;
const CAPS=[
[3.0,6.6,'A dam holds back a whole <b>lake</b>.'],
[6.6,10.2,'But the water does not push <i>equally</i> everywhere.'],
[10.6,14.2,'The <b>deeper</b> you go, the harder it pushes.'],
[14.2,18.2,'<i>p = ρ g h</i>: pressure grows in a straight line with depth.'],
[18.6,22.4,'A thin wall would bend most at its <b>base</b>…'],
[22.4,26.0,'…and crack on the <b>water side</b>, where it is stretched.'],
[26.4,30.4,'So engineers make the base <i>thick</i>, and the top thin.'],
[33.2,36.6,'Now a <b>gate</b> in the wall: 1.5 m wide, 2 m tall.'],
[36.6,40.4,'Its top edge is <b>1 m</b> below the water.'],
[44.6,47.0,'h̄ = depth of the gate’s <i>centroid</i>.'],[47.2,51.2,'The push acts <b>lower</b>, at h*: the <i>centre of pressure</i>.'],
[51.2,55.0,'…because the <b>bottom</b> is pushed harder than the top.'],
[57.6,61.6,'Move the gate <b>1 m deeper</b>. What are h̄, h* and F?'],
];
const CAMS=[[0,-.6,6.5,62],[3,-.8,6.4,64],[10,-1.8,6.0,60],[18,-.6,6.2,62],[26,-.8,6.4,62],[31,-.8,6.4,62],[34,-1.2,8.1,190],[44,-1.2,8.0,200],[52,-1.0,7.9,205],[57,-1.2,7.4,150],[62,-1.2,7.2,150],[66,-1.2,7.2,150]];
const RHO=1000,GV=9.81,SURF=10,DAMH=12;
function harrow(tip,len,col,a=1,w=.12,hw=.24,hlmax=.6){ // horizontal arrow pointing +x, tip at world point
 if(len<.03||a<=0)return;const hl=Math.min(hlmax,len*.45);const tx=X(tip[0]),ty=Y(tip[1]),bx=X(tip[0]-len),nx=X(tip[0]-hl);

function damShape(thin,bendA){ // thin: 0 = trapezoid dam, 1 = thin uniform wall. bendA: tip deflection (m, exaggerated)

 g.strokeStyle='rgba(60,50,40,.18)';g.lineWidth=2;for(let y=1.5;y<DAMH;y+=1.5){const w=lerp(wBase,wTop,y/DAMH);g.beginPath();g.moveTo(X(def(y)),Y(y));g.lineTo(X(w+def(y)),Y(y));g.stroke()}}
function pressureArrows(t0,t,maxDepth,scale,step=1,yTop=SURF,a=1){let k=0;
 for(let d=step;d<=maxDepth+1e-6;d+=step){const ap=sm(t0+k*.12,t0+k*.12+.35,t)*a;k++;if(ap<=0)continue;harrow([0,yTop-d],d*scale*ap,C.AM,1)}}
function vdim(x,y0,y1,label,col,a){const A=proj([x,y0]),B=proj([x,y1]);SV.push(`<g opacity="${a}" stroke="${col}" stroke-width="5" fill="${col}"><line x1="${A[0]}" y1="${A[1]}" x2="${B[0]}" y2="${B[1]-14}"/><path d="M${B[0]-12} ${B[1]-18} L${B[0]+12} ${B[1]-18} L${B[0]} ${B[1]}z" stroke="none"/><line x1="${A[0]-16}" y1="${A[1]}" x2="${A[0]+16}" y2="${A[1]}"/></g>`);OV.push(`<div class="chip" style="left:${B[0]}px;top:${B[1]+16}px;transform:translate(-50%,0);text-align:center;border-color:${col};color:${col};opacity:${a};font-size:34px;padding:6px 14px">${label}</div>`)}

function render(t){OV=[];SV=[];

 if(t<32){

  // depth chips (p = rho g h, computed here)
  for(const[d,t0]of[[2,15.2],[6,15.8],[10,16.6]]){const p=RHO*GV*d/1000;chip([-d*.55-.4,SURF-d+.35],`<small>${d} m</small>${p.toFixed(1)} kPa`,'am',sm(t0,t0+.4,t)*pa,0)}

   if(s>0){g.save();g.globalAlpha=s;const gr=g.createRadialGradient(X(0),Y(.3),5,X(0),Y(.3),K(2.2));gr.addColorStop(0,'rgba(255,60,40,.85)');gr.addColorStop(1,'rgba(255,60,40,0)');g.fillStyle=gr;g.fillRect(X(-2.4),Y(2.5),K(5),K(2.5));g.restore();
    chip([.5,2.6],'tension → crack','am',s,0);
    const cr2=sm(22.6,23.4,t);if(cr2>0){g.save();g.strokeStyle='#2b1a14';g.lineWidth=5;g.lineCap='round';g.beginPath();g.moveTo(X(0),Y(.6));g.lineTo(X(.25*cr2),Y(.9));g.lineTo(X(.15*cr2),Y(1.2));g.lineTo(X(.45*cr2),Y(1.5));g.stroke();g.restore()}}}
  const dl=sm(27.4,28.4,t)*(1-sm(30.4,31.2,t));if(dl>0){dimLine([0,-.6],[9,-.6],'thick base',dl,'#ffffff');dimLine([0,DAMH+.9],[2,DAMH+.9],'thin top',dl,'#26303f')}
 }
 // ---- phase B: the gate ----
 const gA=sm(32.2,33.4,t)*(1-sm(61.6,62,t));const gDrop=sm(57.6,58.8,t);const phaseB=1-sm(56.4,57.0,t);
 if(gA>0){
  const gt=SURF-1-gDrop,gb=SURF-3-gDrop; // gate top y=9, bottom y=7
  g.save();g.globalAlpha=gA;rr(X(-.12),Y(gt),K(.24),K(2),6);g.fillStyle='#4a5566';g.fill();g.lineWidth=4;g.strokeStyle='#ffb020';g.stroke();g.restore();
  // pressure on gate: trapezoid arrows from depth 1 to 3
  const ar=sm(40.6,41.8,t)*gA*phaseB;
  for(let i=0;i<=8;i++){const d=1+2*i/8;const ap=sm(40.6+i*.08,41.2+i*.08,t)*gA*phaseB;if(ap>0)harrow([-.14,SURF-d],d*.55*ap,C.AM,1,.045,.1,.22)}
  if(ar>0){g.save();g.globalAlpha=ar;g.setLineDash([10,8]);g.lineWidth=4;g.strokeStyle='#FF5A2A';g.beginPath();g.moveTo(X(-.14-.55),Y(gt));g.lineTo(X(-.14-1.65),Y(gb));g.stroke();g.restore()}
  chip([-.14,gt+.15],gDrop>.5?'top: 2 m deep':'top: 1 m deep','wh',sm(37.2,37.8,t)*gA*(1-sm(43.2,43.6,t)+sm(57.6,58.2,t)),-6);
  dimLine([.45,gt],[.45,gb],'',0);
  // centroid and centre of pressure
  const cA=sm(44.6,45.2,t)*gA*phaseB;if(cA>0){circ(X(0),Y(SURF-2),K(.09),'#ffffff');vdim(-3.1,SURF,SURF-2,'h̄ = 2 m<br><span style="font-size:24px">centroid depth</span>','#ffffff',cA);dashH(-3.1,0,SURF-2,'#ffffff',cA)}
  const pA=sm(48.6,49.4,t)*gA*phaseB;if(pA>0){circ(X(0),Y(SURF-2.167),K(.11),'#ff3b2a');harrow([-.05,SURF-2.167],.55,'#ff3b2a',pA,.06,.13,.25);vdim(-1.8,SURF,SURF-2.167,'h* = 2.17 m<br><span style="font-size:24px">centre of pressure</span>','#ffc244',pA);dashH(-1.8,0,SURF-2.167,'#ffc244',pA)}
  const qA=sm(58.8,59.4,t)*gA;if(qA>0){chip([.9,SURF-1.5-gDrop],'h̄ = ?','wh big',qA,0);chip([.9,SURF-2.6-gDrop],'h* = ?','am big',qA,0)}
 }
 // ---- equation panel ----
 const eqA=sm(43.6,44.1,t)*phaseB;

  let h='';for(const[st,txt,cl]of lines){const k=lin(st,st+1.0,t);if(k<=0){h+='<div class="l"></div>';continue}
   const plain=txt.replace(/<[^>]+>/g,'');const n=Math.ceil(plain.length*k);let out='',cnt=0;for(let i=0;i<txt.length;i++){if(txt[i]==='<'){const j=txt.indexOf('>',i);out+=txt.slice(i,j+1);i=j;continue}if(cnt>=n)break;out+=txt[i];cnt++}
   if((out.match(/<sub>/g)||[]).length>(out.match(/<\/sub>/g)||[]).length)out+='</sub>';h+=`<div class="l ${cl}">${out}</div>`}
  OV.push(`<div id="eq" style="opacity:${eqA};transform:translateY(${(1-sm(43.6,44.2,t))*30}px)">${h}</div>`)}

 OV.push(caption(t));hook(t);
 sticker(t,3.0,'THE IDEA');sticker(t,31.6,'THE MATH');sticker(t,57.0,'YOUR TURN');
 wipe(t,32);wipe(t,57);
 if(t>=46.4&&t<47.1)burst(330,520,46.4,t,'#3df0d8');if(t>=13.2&&t<13.9){const p=proj([0,0]);burst(p[0],p[1]-40,13.2,t,'#FF5A2A')}
 OV.push(`<div id="prog" style="width:${clamp(t/T_END)*1080}px"></div>`);
 // end card
 const e=sm(62,62.8,t);document.getElementById('gl').style.filter=e>0?`blur(${e*14}px) brightness(${1-e*.45})`:'none';
 if(e>0)OV.push(`<div id="end" style="opacity:${e};transform:translateY(${(1-e)*60}px)"><div class="phone"><div class="scr">

  <path d="M250 40 L240 40 M250 90 L215 90 M250 140 L190 140 M250 190 L165 190" stroke="#ffb020" stroke-width="7" stroke-linecap="round"/><path d="M250 20 L160 210" stroke="#FF5A2A" stroke-width="3" stroke-dasharray="8 6"/></svg>
  <div class="sl"></div><div style="font:600 22px Inter;color:#9fb0cc">Depth of top edge = 2.0 m</div></div>
  <div class="card" style="font:700 30px/1.6 Inter;font-variant-numeric:tabular-nums"><span style="color:#fff">h̄ = <b style="color:#ffb020">?</b></span><br><span style="color:#fff">h* = <b style="color:#ffb020">?</b></span><br><span style="color:#fff">F = <b style="color:#ffb020">?</b></span></div>
